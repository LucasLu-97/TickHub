name: Build Notification Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build demo debug APK
        run: ./gradlew :notifydemo:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          APK=$(find notifydemo/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "No demo APK"; exit 1; fi
          cp "$APK" NotifyDemo.apk
          ls -lh NotifyDemo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notify-demo-apk
          path: NotifyDemo.apk
          retention-days: 7
