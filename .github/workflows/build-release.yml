name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest ships a complete Android SDK; no setup-android action needed.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode version from tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${TAG#v}"
          else
            VERSION_NAME="0.0.1-dev-${GITHUB_RUN_NUMBER}"
          fi
          # Semantic versionCode: MAJOR*1e6 + MINOR*1e4 + PATCH*100 + (0..99).
          # Stable adds 100 so every beta < stable and beta1 < beta2 < ... < beta99.
          # Independent of run numbers (which jump on manual dispatch).
          NUMERIC="${VERSION_NAME%%-*}"  # strip -beta/-dev suffix
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NUMERIC"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          if [ "$MINOR" -ge 100 ] || [ "$PATCH" -ge 100 ]; then
            echo "MINOR/PATCH must be < 100 for semantic versionCode"; exit 1
          fi
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100))
          BETA_NUM=$(echo "${VERSION_NAME}" | sed -n 's/.*beta\([0-9]*\).*/\1/p')
          case "${VERSION_NAME,,}" in
            *beta*)
              IS_BETA=true
              # beta (no number) = 1, beta2 = 2 ... beta99 = 99
              if [ -z "$BETA_NUM" ]; then BETA_NUM=1; fi
              if [ "$BETA_NUM" -ge 100 ]; then echo "beta number >= 100 unsupported"; exit 1; fi
              VERSION_CODE=$((VERSION_CODE + BETA_NUM))
              ;;
            *) IS_BETA=false; VERSION_CODE=$((VERSION_CODE + 100)) ;;
          esac
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "is_beta=${IS_BETA}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_NAME} (${VERSION_CODE}) beta=${IS_BETA}"

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew test

      - name: Verify R8 keep rules (crash prevention)
        run: |
          # Three launch crashes were caused by R8 stripping reflectively-created
          # classes. Fail the build if any critical keep rule is missing.
          # Exact full-line checks: a plain substring grep passes even if the
          # rule is only mentioned in a comment (v2.0 ErrorBody regression).
          # NOTE: GitHub Actions transforms `$$` into a single `$` inside run:
          # blocks, so the serializer rule is checked by its unique prefix
          # (no `$$` literal). Other rules are matched as exact full lines.
          grep -Fxq -- '-keep,includedescriptorclasses class com.lucaslu.tickhub.data.**$$serializer { *; }' app/proguard-rules.pro 2>/dev/null \
            || grep -Fq -- '-keep,includedescriptorclasses class com.lucaslu.tickhub.data.**' app/proguard-rules.pro \
            || { echo "MISSING keep rule: serializer descriptor"; exit 1; }
          for rule in \
            '-keep class com.lucaslu.tickhub.data.** { *; }' \
            '-keep class androidx.work.impl.** { *; }' \
            '-keep class androidx.startup.** { *; }' \
            '-keep class * extends androidx.work.InputMerger { public <init>(); }' \
            '-keep class * extends androidx.work.ListenableWorker { *; }'; do
            grep -Fxq -- "$rule" app/proguard-rules.pro || { echo "MISSING keep rule: $rule"; exit 1; }
          done
          echo "R8 keep rules present"

      - name: Build signed release APK (R8)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_TYPE: ${{ secrets.KEYSTORE_TYPE }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PgithubClientId="${{ vars.GITHUB_CLIENT_ID }}"

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          cp "$APK" "TickHub-v${{ steps.version.outputs.name }}.apk"
          ls -lh "TickHub-v${{ steps.version.outputs.name }}.apk"

      - name: Verify APK signature (release key, not debug)
        run: |
          APK="TickHub-v${{ steps.version.outputs.name }}.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -1)
          "$APKSIGNER" verify --print-certs "$APK"
          # Fail if signed with the Android debug key (would break overwrite installs).
          "$APKSIGNER" verify --print-certs "$APK" | grep -qi "CN=Android Debug" && { echo "DEBUG-SIGNED RELEASE!"; exit 1; } || true
          echo "APK signature verified"

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${{ steps.version.outputs.is_beta }}" = "true" ]; then
            cat > RELEASE_BODY.md <<'EOF'
          TickHub Android 测试版构建（由 Actions 自动签名产出）。

          - 版本：v${{ steps.version.outputs.name }}（versionCode ${{ steps.version.outputs.code }}）
          - 签名：与后续更新使用同一密钥，可直接覆盖安装

          > 测试版，仅供作者与受邀者使用。
          EOF
          else
            cat > RELEASE_BODY.md <<'EOF'
          # TickHub v${{ steps.version.outputs.name }}

          把手机变成 GitHub Actions 的可靠调度中心。

          - 登录：GitHub OAuth Device Flow，装完即用
          - 调度：精确闹钟 + 网络等待 + dispatch + 补触发，夜间到点准时触发
          - 规则：单次 / 每天 / 每周 / 法定工作日 / 法定节假日 / 每隔 N 天，支持一天多时段
          - 结果：追踪真实执行时长并通知，漏触发自动补跑
          - 架构：100% Kotlin + Compose + WorkManager，R8 瘦身，轻量级低功耗

          签名 APK 可直接覆盖安装。完整文档见仓库 README 与开发需求文档。

          > 国产 ROM 请务必开启自启动 + 电池无限制 + 精确闹钟，否则后台定时可能失效。
          EOF
          fi

      - name: Create/Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TickHub-v${{ steps.version.outputs.name }}.apk
          name: TickHub v${{ steps.version.outputs.name }}
          body_path: RELEASE_BODY.md
          prerelease: ${{ steps.version.outputs.is_beta == 'true' }}
          make_latest: ${{ steps.version.outputs.is_beta == 'false' }}

      - name: Clean up signing keystore
        if: always()
        run: rm -f app/build/tickhub-release.p12

      - name: Upload APK artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TickHub-apk
          path: TickHub-v${{ steps.version.outputs.name }}.apk
