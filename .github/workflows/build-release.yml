name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest ships a complete Android SDK; no setup-android action needed.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode version from tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${TAG#v}"
          else
            VERSION_NAME="0.0.1-dev-${GITHUB_RUN_NUMBER}"
          fi
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Assemble release
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_TYPE: ${{ secrets.KEYSTORE_TYPE }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PgithubClientId="${{ vars.GITHUB_CLIENT_ID }}"

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          cp "$APK" "TickHub-v${{ steps.version.outputs.name }}.apk"

      - name: Create/Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TickHub-v${{ steps.version.outputs.name }}.apk
          name: TickHub v${{ steps.version.outputs.name }}
          body: |
            TickHub Android 测试版构建（由 Actions 自动签名产出）。

            - 版本：v${{ steps.version.outputs.name }}（versionCode ${{ steps.version.outputs.code }}）
            - 架构：arm64-v8a
            - 签名：与后续更新使用同一密钥，可直接覆盖安装

            > 测试版，仅供作者与受邀者使用。
          prerelease: true

      - name: Upload APK artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TickHub-apk
          path: TickHub-v${{ steps.version.outputs.name }}.apk
